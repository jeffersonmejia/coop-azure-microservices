name: Backend Service Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Maven artifact name e.g. auth-service'
        required: true
        type: string
      service-path:
        description: 'Relative path to service directory e.g. services/auth-service'
        required: true
        type: string
      docker-image-name:
        description: 'ACR image name e.g. coop-auth'
        required: true
        type: string
      container-app-name:
        description: 'Azure Container App name e.g. ca-coop-dev-auth'
        required: true
        type: string
      server-port:
        description: 'Service port e.g. 8081'
        required: true
        type: string
      deploy_to:
        description: 'Target environment: staging or production'
        required: false
        type: string
        default: 'staging'

      deploy_only:
        description: 'If true, skip test and build jobs and run deployment only (uses staging image tag)'
        required: false
        type: boolean
        default: false

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_DB_PASSWORD:
        required: true

env:
  AZURE_RESOURCE_GROUP: rg-coop-scus-dev
  AZURE_ACR_NAME: acrcoopdev

jobs:

  # ==========================================================
  # TEST
  # ==========================================================

  test:
    name: Tests - ${{ inputs.service-name }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: coop
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U coop -d coop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip tests for deploy_only
        if: ${{ inputs.deploy_only == true }}
        run: |
          echo "deploy_only requested; skipping tests"
          # succeed early; subsequent test steps are conditional
          exit 0

      - name: Set up JDK 21
        if: ${{ inputs.deploy_only == false }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ inputs.service-path }}/pom.xml

      - name: Run tests
        if: ${{ inputs.deploy_only == false }}
        run: ./mvnw -B test


  # ==========================================================
  # BUILD
  # ==========================================================

  build:
    name: Build - ${{ inputs.service-name }}
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Deploy-only: set image-tag and skip build'
        id: meta
        if: ${{ inputs.deploy_only == true }}
        run: |
          echo "deploy_only requested; skipping full build and using staging tag"
          echo "image-tag=staging" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM
        if: ${{ inputs.deploy_only == false }}
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build native image
        if: ${{ inputs.deploy_only == false }}
        run: ./mvnw -Pnative native:compile -DskipTests -B

      - name: Build Docker image
        if: ${{ inputs.deploy_only == false }}
        id: meta
        run: |
          cp target/${{ inputs.service-name }} ./${{ inputs.service-name }}-native

          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}"

          docker build \
            -f Dockerfile.native \
            --build-arg SERVICE_NAME=${{ inputs.service-name }}-native \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:staging" \
            .

          echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        if: ${{ inputs.deploy_only == false }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: ${{ inputs.deploy_only == false }}
        run: |
          az acr login \
            --name ${{ env.AZURE_ACR_NAME }}

      - name: Push Docker image
        if: ${{ inputs.deploy_only == false }}
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}"

          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:staging"


  # ==========================================================
  # STAGING
  # ==========================================================

  deploy-staging:
    name: Deploy Staging - ${{ inputs.service-name }}
    needs: build

    if: ${{ inputs.deploy_to == 'staging' }}

    runs-on: ubuntu-latest

    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:

      # ------------------------------------------------------
      # Azure login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------
      # Deploy image
      # ------------------------------------------------------

      - name: Deploy to Container Apps
        run: |
          set -euo pipefail

          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}:${{ needs.build.outputs.image-tag }}"

          echo "Deploying image:"
          echo "$IMAGE"

          if az containerapp show \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              &>/dev/null; then

            echo "Container App already exists. Updating image..."

            az containerapp update \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"

          else

            echo "Container App does not exist. Creating..."

            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" \
              -o tsv)

            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" \
              -o tsv)

            az containerapp create \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external \
              --target-port ${{ inputs.server-port }} \
              --transport http \
              --min-replicas 1 \
              --max-replicas 3 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID" \
              --env-vars \
                "SERVER_PORT=${{ inputs.server-port }}" \
                "SPRING_DATASOURCE_URL=jdbc:postgresql://psql-coop-dev.postgres.database.azure.com:5432/coop?sslmode=require" \
                "SPRING_DATASOURCE_USERNAME=coopadmin" \
                "SPRING_DATASOURCE_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}" \
                "JWT_SECRET=dev-jwt-secret-change-in-prod"

          fi

      # ------------------------------------------------------
      # Wait for image revision to exist
      # ------------------------------------------------------

      - name: Wait for deployment revision
        run: |
          set -euo pipefail

          REVISION=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Initial deployment revision: $REVISION"

          for i in $(seq 1 30); do

            PROVISIONING_STATE=$(az containerapp revision show \
              --revision "$REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.provisioningState" \
              -o tsv 2>/dev/null || echo "Unknown")

            echo "Attempt $i/30 - provisioningState=$PROVISIONING_STATE"

            if [ "$PROVISIONING_STATE" = "Provisioned" ]; then
              echo "Initial revision provisioned."
              break
            fi

            if [ "$PROVISIONING_STATE" = "Failed" ]; then
              echo "Azure reported a failed revision."
              az containerapp revision show \
                --revision "$REVISION" \
                --name "${{ inputs.container-app-name }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                -o json
              exit 1
            fi

            sleep 10

          done

          if [ "$PROVISIONING_STATE" != "Provisioned" ]; then
            echo "Initial revision was not provisioned within timeout."
            exit 1
          fi

      # ------------------------------------------------------
      # Configure probes
      #
      # Startup  -> TCP
      # Readiness -> HTTP /actuator/health
      # Liveness -> TCP
      #
      # Important:
      # modifying probes can create another revision.
      # ------------------------------------------------------

      - name: Configure health probes
        run: |
          set -euo pipefail

          echo "Configuring Startup, Readiness and Liveness probes... (capping initialDelaySeconds at 60)"

          CURRENT=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            -o json)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg port "${{ inputs.server-port }}" \
            '
            # Ensure readiness initialDelaySeconds <= 60 to satisfy Azure limits
            .properties.template.containers[0].probes = [

              {
                "type": "Startup",
                "tcpSocket": {
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 10,
                "periodSeconds": 30,
                "timeoutSeconds": 5,
                "failureThreshold": 10,
                "successThreshold": 1
              },

              {
                "type": "Readiness",
                "httpGet": {
                  "path": "/actuator/health",
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 60,
                "periodSeconds": 30,
                "timeoutSeconds": 10,
                "failureThreshold": 3,
                "successThreshold": 1
              },

              {
                "type": "Liveness",
                "tcpSocket": {
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 60,
                "periodSeconds": 30,
                "timeoutSeconds": 5,
                "failureThreshold": 3,
                "successThreshold": 1
              }

            ]
            ')

          echo "$UPDATED" > /tmp/app-update.json

          az containerapp update \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --yaml /tmp/app-update.json

      # ------------------------------------------------------
      # CRITICAL FIX
      #
      # Re-read latestRevisionName AFTER configuring probes.
      # This is the revision we actually need to validate.
      # ------------------------------------------------------

      - name: Wait for final healthy revision
        run: |
          set -euo pipefail

          sleep 5

          FINAL_REVISION=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Final revision with health probes: $FINAL_REVISION"
          echo "Waiting until Azure reports the revision as Healthy and serving traffic..."

          FINAL_PROVISIONING_STATE="Unknown"
          HEALTH_STATE="None"
          REPLICAS_NUM=0

          for i in $(seq 1 60); do

            FINAL_PROVISIONING_STATE=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.provisioningState" \
              -o tsv 2>/dev/null || echo "Unknown")

            HEALTH_STATE=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.healthState" \
              -o tsv 2>/dev/null || echo "None")

            REPLICAS=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.replicas" \
              -o tsv 2>/dev/null || echo "0")

            # normalize numeric replicas
            REPLICAS_NUM=$(echo "$REPLICAS" | tr -cd '0-9') || true
            if [ -z "$REPLICAS_NUM" ]; then
              REPLICAS_NUM=0
            fi

            echo "Attempt $i/60 - provisioning=$FINAL_PROVISIONING_STATE health=$HEALTH_STATE replicas=$REPLICAS_NUM"

            if [ "$FINAL_PROVISIONING_STATE" = "Failed" ]; then

              echo "Final revision provisioning failed."

              az containerapp revision show \
                --revision "$FINAL_REVISION" \
                --name "${{ inputs.container-app-name }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                -o json

              exit 1

            fi

            if [ "$FINAL_PROVISIONING_STATE" = "Provisioned" ] && \
               [ "$HEALTH_STATE" = "Healthy" ] && \
               [ "$REPLICAS_NUM" -gt 0 ]; then

              echo "Final revision is Provisioned, Healthy and has replicas > 0."
              break

            fi

            sleep 10

          done

          if [ "$FINAL_PROVISIONING_STATE" != "Provisioned" ] || \
             [ "$HEALTH_STATE" != "Healthy" ] || \
             [ "$REPLICAS_NUM" -le 0 ]; then

            echo "Final revision did not become healthy and serving within timeout."

            echo "Final Azure revision information:"

            az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              -o json || true

            exit 1

          fi

      # ------------------------------------------------------
      # External HTTP verification
      # ------------------------------------------------------

      - name: Health check
        run: |
          set -euo pipefail

          # Use the revision-specific FQDN to avoid 404s before the revision receives traffic
          APP_FQDN=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionFqdn" \
            -o tsv)

          HEALTH_URL="https://${APP_FQDN}/actuator/health"
          HEALTH_URL_FALLBACK="https://${APP_FQDN}/actuator/health/readiness"

          echo "External health URL:"
          echo "$HEALTH_URL"

          for i in $(seq 1 18); do

            HTTP_STATUS=$(curl \
              --retry 8 --retry-delay 6 --retry-connrefused \
              --connect-timeout 5 \
              --max-time 10 \
              -s \
              -o /tmp/health-response.json \
              -w "%{http_code}" \
              "$HEALTH_URL" || true)

            echo "Attempt $i/18 - HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "Health check passed."
              cat /tmp/health-response.json || true
              echo
              exit 0

            fi

            # if 404 try a readiness-specific endpoint as fallback
            if [ "$HTTP_STATUS" = "404" ]; then
              echo "Received 404 from $HEALTH_URL, trying fallback $HEALTH_URL_FALLBACK"
              HTTP_STATUS2=$(curl \
                --retry 4 --retry-delay 3 --retry-connrefused \
                --connect-timeout 5 \
                --max-time 10 \
                -s -o /tmp/health-response-fallback.json -w "%{http_code}" "$HEALTH_URL_FALLBACK" || true)

              echo "Fallback HTTP $HTTP_STATUS2"
              if [ "$HTTP_STATUS2" = "200" ]; then
                echo "Fallback health check passed."
                cat /tmp/health-response-fallback.json || true
                exit 0
              fi
            fi

            if [ -f /tmp/health-response.json ]; then
              echo "Response:"
              cat /tmp/health-response.json || true
              echo
            fi

            sleep 10

          done

          echo "External health check failed."

          echo "Revision debug output:"
          az containerapp revision show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --revision "$(az containerapp show --name "${{ inputs.container-app-name }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --query properties.latestRevisionName -o tsv)" \
            -o json || true

          exit 1


  # ==========================================================
  # PRODUCTION
  # ==========================================================

  deploy-production:
    name: Deploy Production - ${{ inputs.service-name }}
    needs: build

    if: ${{ inputs.deploy_to == 'production' }}

    runs-on: ubuntu-latest

    environment: production

    permissions:
      id-token: write
      contents: read

    steps:

      # ------------------------------------------------------
      # Azure login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------
      # Deploy image
      # ------------------------------------------------------

      - name: Deploy to Container Apps
        run: |
          set -euo pipefail

          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}:${{ needs.build.outputs.image-tag }}"

          echo "Deploying image:"
          echo "$IMAGE"

          if az containerapp show \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              &>/dev/null; then

            echo "Container App already exists. Updating image..."

            az containerapp update \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"

          else

            echo "Container App does not exist. Creating..."

            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" \
              -o tsv)

            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" \
              -o tsv)

            az containerapp create \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external \
              --target-port ${{ inputs.server-port }} \
              --transport http \
              --min-replicas 1 \
              --max-replicas 3 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID" \
              --env-vars \
                "SERVER_PORT=${{ inputs.server-port }}" \
                "SPRING_DATASOURCE_URL=jdbc:postgresql://psql-coop-dev.postgres.database.azure.com:5432/coop?sslmode=require" \
                "SPRING_DATASOURCE_USERNAME=coopadmin" \
                "SPRING_DATASOURCE_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}" \
                "JWT_SECRET=dev-jwt-secret-change-in-prod"

          fi

      # ------------------------------------------------------
      # Wait for image revision
      # ------------------------------------------------------

      - name: Wait for deployment revision
        run: |
          set -euo pipefail

          REVISION=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Initial production revision: $REVISION"

          for i in $(seq 1 30); do

            PROVISIONING_STATE=$(az containerapp revision show \
              --revision "$REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.provisioningState" \
              -o tsv 2>/dev/null || echo "Unknown")

            echo "Attempt $i/30 - provisioningState=$PROVISIONING_STATE"

            if [ "$PROVISIONING_STATE" = "Provisioned" ]; then
              echo "Initial production revision provisioned."
              break
            fi

            if [ "$PROVISIONING_STATE" = "Failed" ]; then

              echo "Azure reported a failed revision."

              az containerapp revision show \
                --revision "$REVISION" \
                --name "${{ inputs.container-app-name }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                -o json

              exit 1

            fi

            sleep 10

          done

          if [ "$PROVISIONING_STATE" != "Provisioned" ]; then
            echo "Initial production revision was not provisioned within timeout."
            exit 1
          fi

      # ------------------------------------------------------
      # Configure probes
      # ------------------------------------------------------

      - name: Configure health probes
        run: |
          set -euo pipefail

          echo "Configuring Startup, Readiness and Liveness probes... (capping initialDelaySeconds at 60)"

          CURRENT=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            -o json)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg port "${{ inputs.server-port }}" \
            '
            # Ensure readiness initialDelaySeconds <= 60 to satisfy Azure limits
            .properties.template.containers[0].probes = [

              {
                "type": "Startup",
                "tcpSocket": {
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 10,
                "periodSeconds": 30,
                "timeoutSeconds": 5,
                "failureThreshold": 10,
                "successThreshold": 1
              },

              {
                "type": "Readiness",
                "httpGet": {
                  "path": "/actuator/health",
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 60,
                "periodSeconds": 30,
                "timeoutSeconds": 10,
                "failureThreshold": 3,
                "successThreshold": 1
              },

              {
                "type": "Liveness",
                "tcpSocket": {
                  "port": ($port | tonumber)
                },
                "initialDelaySeconds": 60,
                "periodSeconds": 30,
                "timeoutSeconds": 5,
                "failureThreshold": 3,
                "successThreshold": 1
              }

            ]
            ')

          echo "$UPDATED" > /tmp/app-update.json

          az containerapp update \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --yaml /tmp/app-update.json

      # ------------------------------------------------------
      # Wait for FINAL revision
      # ------------------------------------------------------

      - name: Wait for final healthy revision
        run: |
          set -euo pipefail

          sleep 5

          FINAL_REVISION=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Final production revision: $FINAL_REVISION"
          echo "Waiting until Azure reports the revision as Healthy and serving traffic..."

          FINAL_PROVISIONING_STATE="Unknown"
          HEALTH_STATE="None"
          REPLICAS_NUM=0

          for i in $(seq 1 60); do

            FINAL_PROVISIONING_STATE=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.provisioningState" \
              -o tsv 2>/dev/null || echo "Unknown")

            HEALTH_STATE=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.healthState" \
              -o tsv 2>/dev/null || echo "None")

            REPLICAS=$(az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.replicas" \
              -o tsv 2>/dev/null || echo "0")

            # normalize numeric replicas
            REPLICAS_NUM=$(echo "$REPLICAS" | tr -cd '0-9') || true
            if [ -z "$REPLICAS_NUM" ]; then
              REPLICAS_NUM=0
            fi

            echo "Attempt $i/60 - provisioning=$FINAL_PROVISIONING_STATE health=$HEALTH_STATE replicas=$REPLICAS_NUM"

            if [ "$FINAL_PROVISIONING_STATE" = "Failed" ]; then

              echo "Final production revision provisioning failed."

              az containerapp revision show \
                --revision "$FINAL_REVISION" \
                --name "${{ inputs.container-app-name }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                -o json

              exit 1

            fi

            if [ "$FINAL_PROVISIONING_STATE" = "Provisioned" ] && \
               [ "$HEALTH_STATE" = "Healthy" ] && \
               [ "$REPLICAS_NUM" -gt 0 ]; then

              echo "Final production revision is Provisioned, Healthy and has replicas > 0."
              break

            fi

            sleep 10

          done

          if [ "$FINAL_PROVISIONING_STATE" != "Provisioned" ] || \
             [ "$HEALTH_STATE" != "Healthy" ] || \
             [ "$REPLICAS_NUM" -le 0 ]; then

            echo "Final production revision did not become healthy and serving within timeout."

            az containerapp revision show \
              --revision "$FINAL_REVISION" \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              -o json || true

            exit 1

          fi

      # ------------------------------------------------------
      # External HTTP verification
      # ------------------------------------------------------

      - name: Health check
        run: |
          set -euo pipefail

          # Use revision-specific FQDN to avoid 404s before traffic is routed
          APP_FQDN=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.latestRevisionFqdn" \
            -o tsv)

          HEALTH_URL="https://${APP_FQDN}/actuator/health"
          HEALTH_URL_FALLBACK="https://${APP_FQDN}/actuator/health/readiness"

          echo "External health URL:"
          echo "$HEALTH_URL"

          for i in $(seq 1 18); do

            HTTP_STATUS=$(curl \
              --retry 8 --retry-delay 6 --retry-connrefused \
              --connect-timeout 5 \
              --max-time 10 \
              -s \
              -o /tmp/health-response.json \
              -w "%{http_code}" \
              "$HEALTH_URL" || true)

            echo "Attempt $i/18 - HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "Production health check passed."

              cat /tmp/health-response.json || true
              echo

              exit 0

            fi

            if [ "$HTTP_STATUS" = "404" ]; then
              echo "Received 404 from $HEALTH_URL, trying fallback $HEALTH_URL_FALLBACK"
              HTTP_STATUS2=$(curl \
                --retry 4 --retry-delay 3 --retry-connrefused \
                --connect-timeout 5 --max-time 10 -s -o /tmp/health-response-fallback.json -w "%{http_code}" "$HEALTH_URL_FALLBACK" || true)
              echo "Fallback HTTP $HTTP_STATUS2"
              if [ "$HTTP_STATUS2" = "200" ]; then
                echo "Fallback health check passed."
                cat /tmp/health-response-fallback.json || true
                exit 0
              fi
            fi

            if [ -f /tmp/health-response.json ]; then
              echo "Response:"
              cat /tmp/health-response.json || true
              echo
            fi

            sleep 10

          done

          echo "Production external health check failed."

          echo "Revision debug output:"
          az containerapp revision show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --revision "$(az containerapp show --name "${{ inputs.container-app-name }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --query properties.latestRevisionName -o tsv)" \
            -o json || true

          exit 1