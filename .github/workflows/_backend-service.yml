name: Backend Service Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Maven artifact name e.g. auth-service'
        required: true
        type: string
      service-path:
        description: 'Relative path to service directory e.g. services/auth-service'
        required: true
        type: string
      docker-image-name:
        description: 'ACR image name e.g. coop-auth'
        required: true
        type: string
      container-app-name:
        description: 'Azure Container App name e.g. ca-coop-dev-auth'
        required: true
        type: string
      server-port:
        description: 'Service port e.g. 8081'
        required: true
        type: string
      deploy-to:
        description: 'Target environment: staging or production'
        required: false
        type: string
        default: 'staging'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_DB_PASSWORD:
        required: true

env:
  AZURE_RESOURCE_GROUP: rg-coop-scus-dev
  AZURE_ACR_NAME: acrcoopdev

jobs:
  test:
    name: Tests - ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coop
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coop -d coop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ inputs.service-path }}/pom.xml

      - name: Run tests
        run: ./mvnw -B test

  build:
    name: Build - ${{ inputs.service-name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build native image
        run: ./mvnw -Pnative native:compile -DskipTests -B

      - name: Build Docker image
        id: meta
        run: |
          cp target/${{ inputs.service-name }} ./${{ inputs.service-name }}-native
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}"
          docker build -f Dockerfile.native \
            --build-arg SERVICE_NAME=${{ inputs.service-name }}-native \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:staging" \
            .
          echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.AZURE_ACR_NAME }}

      - name: Push Docker image
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:staging"

  deploy-staging:
    name: Deploy Staging - ${{ inputs.service-name }}
    needs: build
    if: inputs.deploy-to == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}:${{ needs.build.outputs.image-tag }}"
          if az containerapp show --name "${{ inputs.container-app-name }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &>/dev/null; then
            az containerapp update \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
          else
            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            az containerapp create \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external --target-port ${{ inputs.server-port }} --transport http \
              --min-replicas 1 --max-replicas 3 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID" \
              --env-vars \
                "SERVER_PORT=${{ inputs.server-port }}" \
                "SPRING_DATASOURCE_URL=jdbc:postgresql://psql-coop-dev.postgres.database.azure.com:5432/coop?sslmode=require" \
                "SPRING_DATASOURCE_USERNAME=coopadmin" \
                "SPRING_DATASOURCE_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}" \
                "JWT_SECRET=dev-jwt-secret-change-in-prod"
            REVISION=$(az containerapp show \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.latestRevisionName" -o tsv)
            echo "Waiting for revision $REVISION to be ready..."
            az containerapp revision wait \
              --name "$REVISION" \
              --app "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --timeout 300
          fi

      - name: Health check
        run: |
          APP_FQDN=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Waiting for ${{ inputs.service-name }} to be ready..."
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_FQDN}/actuator/health" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP $HTTP_STATUS"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

  deploy-production:
    name: Deploy Production - ${{ inputs.service-name }}
    needs: build
    if: inputs.deploy-to == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ inputs.docker-image-name }}:${{ needs.build.outputs.image-tag }}"
          if az containerapp show --name "${{ inputs.container-app-name }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &>/dev/null; then
            az containerapp update \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
          else
            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            az containerapp create \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external --target-port ${{ inputs.server-port }} --transport http \
              --min-replicas 1 --max-replicas 3 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID" \
              --env-vars \
                "SERVER_PORT=${{ inputs.server-port }}" \
                "SPRING_DATASOURCE_URL=jdbc:postgresql://psql-coop-dev.postgres.database.azure.com:5432/coop?sslmode=require" \
                "SPRING_DATASOURCE_USERNAME=coopadmin" \
                "SPRING_DATASOURCE_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}" \
                "JWT_SECRET=dev-jwt-secret-change-in-prod"
            REVISION=$(az containerapp show \
              --name "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.latestRevisionName" -o tsv)
            echo "Waiting for revision $REVISION to be ready..."
            az containerapp revision wait \
              --name "$REVISION" \
              --app "${{ inputs.container-app-name }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --timeout 300
          fi

      - name: Health check
        run: |
          APP_FQDN=$(az containerapp show \
            --name "${{ inputs.container-app-name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Waiting for ${{ inputs.service-name }} in production..."
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_FQDN}/actuator/health" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP $HTTP_STATUS"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
