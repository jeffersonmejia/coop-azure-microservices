name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      deploy-to:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-coop-scus-dev
  AZURE_ACR_NAME: acrcoopdev

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build - Frontend
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Build Docker image
        id: meta
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/coop-frontend"
          docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:staging" \
            .
          echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.AZURE_ACR_NAME }}

      - name: Push Docker image
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/coop-frontend"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:staging"

  deploy-staging:
    name: Deploy Staging - Frontend
    needs: build
    if: inputs.deploy-to == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/coop-frontend:${{ needs.build.outputs.image-tag }}"
          if az containerapp show --name "ca-coop-dev-frontend" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &>/dev/null; then
            az containerapp update \
              --name "ca-coop-dev-frontend" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
          else
            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            az containerapp create \
              --name "ca-coop-dev-frontend" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external --target-port 4200 --transport http \
              --min-replicas 1 --max-replicas 2 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID"
          fi

      - name: Health check
        run: |
          APP_FQDN=$(az containerapp show \
            --name "ca-coop-dev-frontend" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_FQDN}" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP $HTTP_STATUS"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

  deploy-production:
    name: Deploy Production - Frontend
    needs: build
    if: inputs.deploy-to == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          IMAGE="${{ env.AZURE_ACR_NAME }}.azurecr.io/coop-frontend:${{ needs.build.outputs.image-tag }}"
          if az containerapp show --name "ca-coop-dev-frontend" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &>/dev/null; then
            az containerapp update \
              --name "ca-coop-dev-frontend" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
          else
            CAE_ID=$(az containerapp env show \
              --name "cae-coop-dev" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            IDENTITY_ID=$(az identity show \
              --name "id-coop-dev-acr-pull" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "id" -o tsv)
            az containerapp create \
              --name "ca-coop-dev-frontend" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --environment "$CAE_ID" \
              --image "$IMAGE" \
              --ingress external --target-port 4200 --transport http \
              --min-replicas 1 --max-replicas 2 \
              --registry-server "${{ env.AZURE_ACR_NAME }}.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --user-assigned "$IDENTITY_ID"
          fi

      - name: Health check
        run: |
          APP_FQDN=$(az containerapp show \
            --name "ca-coop-dev-frontend" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Waiting for frontend in production..."
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_FQDN}" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP $HTTP_STATUS"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
