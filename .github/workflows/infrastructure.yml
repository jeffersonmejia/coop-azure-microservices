name: Infra - Terraform

on:
  workflow_call:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate
        run: |
          STATE_ACCOUNT="stcoopdevd5174d35"
          az storage account create \
            --name "$STATE_ACCOUNT" \
            --resource-group "rg-coop-scus-dev" \
            --location "southcentralus" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            --only-show-errors
          STATE_KEY=$(az storage account keys list \
            --account-name "$STATE_ACCOUNT" \
            --resource-group "rg-coop-scus-dev" \
            --query '[0].value' -o tsv)
          az storage container create \
            --name tfstate \
            --account-name "$STATE_ACCOUNT" \
            --account-key "$STATE_KEY" \
            --public-access off \
            --only-show-errors
          terraform init -input=false \
            -backend-config="resource_group_name=rg-coop-scus-dev" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=coop-dev.tfstate" \
            -backend-config="access_key=$STATE_KEY"
          terraform validate

      - name: Plan (read-only)
        env:
          TF_VAR_postgres_administrator_password: ${{ secrets.AZURE_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.AZURE_JWT_SECRET }}
        run: terraform plan -input=false -var-file=dev.tfvars

  apply:
    name: Terraform apply
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply
        env:
          TF_VAR_postgres_administrator_password: ${{ secrets.AZURE_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.AZURE_JWT_SECRET }}
        run: |
          STATE_ACCOUNT="stcoopdevd5174d35"
          az storage account create \
            --name "$STATE_ACCOUNT" \
            --resource-group "rg-coop-scus-dev" \
            --location "southcentralus" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            --only-show-errors
          STATE_KEY=$(az storage account keys list \
            --account-name "$STATE_ACCOUNT" \
            --resource-group "rg-coop-scus-dev" \
            --query '[0].value' -o tsv)
          az storage container create \
            --name tfstate \
            --account-name "$STATE_ACCOUNT" \
            --account-key "$STATE_KEY" \
            --public-access off \
            --only-show-errors
          terraform init -input=false \
            -backend-config="resource_group_name=rg-coop-scus-dev" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=coop-dev.tfstate" \
            -backend-config="access_key=$STATE_KEY"
          terraform plan -input=false -var-file=dev.tfvars -out=tfplan
          terraform apply -input=false tfplan
