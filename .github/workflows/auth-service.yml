name: Auth Service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
      - '.github/workflows/_backend-service.yml'
  workflow_dispatch:
    inputs:
      deploy-to:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_backend-service.yml
    with:
      service-name: auth-service
      service-path: services/auth-service
      docker-image-name: coop-auth
      container-app-name: ca-coop-dev-auth
      server-port: '8081'
      deploy-to: ${{ inputs.deploy-to || 'staging' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
