spring.application.name=payment-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coop}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=payments

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=payments
spring.flyway.create-schemas=true

app.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
