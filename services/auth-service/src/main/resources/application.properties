spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coop}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth
spring.flyway.create-schemas=true

app.jwt.secret=${JWT_SECRET:dev-secret-change-me-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
