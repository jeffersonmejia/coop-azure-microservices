services:
  postgres:
    image: postgres:16-alpine
    container_name: coop-postgres
    environment:
      POSTGRES_DB: coop
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d coop"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    container_name: coop-auth-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coop
      SPRING_DATASOURCE_USERNAME: coop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coop}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-production}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"
    restart: unless-stopped

  account-service:
    build: ./services/account-service
    container_name: coop-account-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coop
      SPRING_DATASOURCE_USERNAME: coop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coop}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-production}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"
    restart: unless-stopped

  payment-service:
    build: ./services/payment-service
    container_name: coop-payment-service
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coop
      SPRING_DATASOURCE_USERNAME: coop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coop}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-production}
      ACCOUNT_SERVICE_URL: http://account-service:8082
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: coop-frontend
    environment:
      PORT: 4200
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
    ports:
      - "4200:4200"
    depends_on:
      - auth-service
      - account-service
      - payment-service
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

volumes:
  postgres-data:
